<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#163b33">
  <title>Lazarus — Website Test</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f0e7; color: #183a31; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 24px; }
    main { width: min(100%, 460px); padding: 42px 28px; text-align: center; background: #fffdf8; border-radius: 18px; box-shadow: 0 10px 30px #183a311b; }
    .mark { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; background: #d7eddf; color: #156349; margin: 0 auto 24px; font-size: 30px; }
    h1 { font-size: clamp(28px, 6vw, 38px); margin: 0 0 12px; line-height: 1.2; }
    p { color: #5b665e; line-height: 1.6; }
    button { background: #215d49; color: white; border: 0; border-radius: 12px; padding: 14px 24px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 12px; }
    a { display: inline-block; margin-top: 24px; color: #215d49; }
    #result { font-weight: 600; color: #176f4d; min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✓</div>
    <h1>GitHub Pages works!</h1>
    <p>The Lazarus family-history website is online. This is a simple test page — no private documents are displayed here.</p>
    <button id="check" type="button">Test interactivity</button>
    <p id="result" aria-live="polite"></p>
    <a href="./">Open the family-history website</a>
  </main>
  <script>
    document.getElementById("check").addEventListener("click", function () {
      document.getElementById("result").textContent = "JavaScript works too ✓";
    });
  </script>
</body>
</html>
